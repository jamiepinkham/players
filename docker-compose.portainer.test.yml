# Local test version of docker-compose.portainer.yml
# This file removes the external 'web' network so you can test locally
# Use with: docker compose -f docker-compose.portainer.test.yml --env-file .env.portainer.test up

services:
  players:
    image: ghcr.io/jamiepinkham/players:${IMAGE_TAG:-main}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # Database Configuration
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_HOST: ${DATABASE_HOST}
      # Rails Configuration
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      RAILS_ENV: ${RAILS_ENV}
      # Mailgun Configuration
      MAILGUN_SMTP_ADDRESS: ${MAILGUN_SMTP_ADDRESS}
      MAILGUN_SMTP_PORT: ${MAILGUN_SMTP_PORT}
      MAILGUN_SMTP_DOMAIN: ${MAILGUN_SMTP_DOMAIN}
      MAILGUN_SMTP_USERNAME: ${MAILGUN_SMTP_USERNAME}
      MAILGUN_SMTP_PASSWORD: ${MAILGUN_SMTP_PASSWORD}
      MAILGUN_SMTP_AUTHENTICATION: ${MAILGUN_SMTP_AUTHENTICATION:-plain}
      MAILER_FROM: ${MAILER_FROM}
      # Notification emails
      NOTIFICATION_FROM_EMAIL: ${NOTIFICATION_FROM_EMAIL}
      FALLBACK_NOTIFICATION_EMAILS: ${FALLBACK_NOTIFICATION_EMAILS}
      # Proxy Configuration
      DISABLE_FORCE_SSL: ${DISABLE_FORCE_SSL:-true}
      RAILS_LOG_TO_STDOUT: ${RAILS_LOG_TO_STDOUT:-true}
      RAILS_SERVE_STATIC_FILES: ${RAILS_SERVE_STATIC_FILES:-true}
      DISABLE_HOST_CHECK: ${DISABLE_HOST_CHECK:-true}
      # Optional
      APP_HOST: ${APP_HOST:-}
      ASSET_HOST: ${ASSET_HOST:-}

  scheduler:
    image: ghcr.io/jamiepinkham/players:${IMAGE_TAG:-main}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["supercronic", "/app/config/crontab"]
    environment:
      # Database Configuration
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_HOST: ${DATABASE_HOST}
      # Rails Configuration
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      RAILS_ENV: ${RAILS_ENV}
      # Logging
      RAILS_LOG_TO_STDOUT: ${RAILS_LOG_TO_STDOUT:-true}

  db:
    image: postgres:16
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      start_period: 30s
    volumes:
      - pgdata_portainer_test:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}

volumes:
  pgdata_portainer_test:
