# Base docker-compose configuration
# Common settings shared across all environments

services:
  players:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mock-stats:
        condition: service_started
    env_file:
      - .env
    environment:
      - STATS_API_URL=http://mock-stats:3001
    entrypoint: /usr/local/bin/web-entrypoint.sh
    ports:
      - "3000:3000"
    volumes:
      # Mount local code changes into the container
      - ./rails/app:/app/app
      - ./rails/config:/app/config
      - ./rails/db:/app/db
      - ./rails/lib:/app/lib
      - ./web-entrypoint.sh:/usr/local/bin/web-entrypoint.sh:ro
      - ./rails/Procfile:/app/Procfile:ro
      - ./rails/package.json:/app/package.json:ro

  db:
    image: postgres:16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 2s
      timeout: 2s
      start_period: 30s
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

  # Mock Stats API - Lightweight fake stats service for local development
  # Provides instant fake player stats without needing the full stats microservice
  # Dashboard will show "MOCK ENVIRONMENT" when using this service
  # To use real stats API instead, change STATS_API_URL above to point to the real service
  mock-stats:
    build:
      context: ./mock-stats
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1

volumes:
  pgdata:
  redisdata:
