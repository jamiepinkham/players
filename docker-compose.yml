services:
  postgres:
    image: postgres:15
    container_name: players-postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend

  players:
    platform: linux/arm64
    build:
      context: .
      dockerfile: rails/Dockerfile
    command: foreman start -f Procfile.dev
    container_name: players
    depends_on:
      - postgres
    volumes:
      - ./rails:/app
    networks:
      - backend

volumes:
  postgres-data:

networks:
  backend:
