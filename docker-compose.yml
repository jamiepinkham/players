# Base docker-compose configuration
# Common settings shared across all environments

services:
  players:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    entrypoint: /usr/local/bin/web-entrypoint.sh
    ports:
      - "3000:3000"
    volumes:
      # Mount local code changes into the container
      - ./rails/app:/app/app
      - ./rails/config:/app/config
      - ./rails/db:/app/db
      - ./rails/lib:/app/lib
      - ./web-entrypoint.sh:/usr/local/bin/web-entrypoint.sh:ro
      - ./rails/Procfile:/app/Procfile:ro
      - ./rails/package.json:/app/package.json:ro

  db:
    image: postgres:16
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 2s
      timeout: 2s
      start_period: 30s
    volumes:
      - pgdata:/var/lib/postgresql/data
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"

volumes:
  pgdata:
  redisdata:
