name: Verify Production Image

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-verify:
    name: Build and Verify Production Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        id: build
        run: |
          echo "Building production Docker image..."
          docker build -f Dockerfile.web.prod -t players-web-prod:ci . 2>&1 | tee build.log

          if [ $? -eq 0 ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "✅ Build succeeded"
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "❌ Build failed"
            exit 1
          fi

      - name: Create test database container
        if: steps.build.outputs.status == 'success'
        run: |
          echo "Starting test database..."
          docker run -d \
            --name test-db \
            --network host \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=testpass123 \
            -e POSTGRES_DB=players_test \
            postgres:13

          # Wait for database to be ready
          echo "Waiting for database to be ready..."
          for i in {1..30}; do
            if docker exec test-db pg_isready -U postgres > /dev/null 2>&1; then
              echo "✅ Database is ready"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ Database failed to start"
              docker logs test-db
              exit 1
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Start application container
        if: steps.build.outputs.status == 'success'
        id: start
        run: |
          echo "Starting application container..."
          docker run -d \
            --name test-app \
            --network host \
            -e RAILS_ENV=production \
            -e SECRET_KEY_BASE=test_secret_key_for_ci_at_least_32_chars_long_abc123def456 \
            -e DATABASE_HOST=localhost \
            -e DATABASE_USER=postgres \
            -e DATABASE_PASSWORD=testpass123 \
            -e DATABASE_NAME=players_test \
            -e RAILS_LOG_TO_STDOUT=true \
            -e RAILS_SERVE_STATIC_FILES=true \
            -p 3000:3000 \
            players-web-prod:ci

          if [ $? -eq 0 ]; then
            echo "status=started" >> $GITHUB_OUTPUT
            echo "✅ Container started"
          else
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "❌ Failed to start container"
            exit 1
          fi

      - name: Wait for application to be ready
        if: steps.start.outputs.status == 'started'
        id: wait
        timeout-minutes: 2
        run: |
          echo "Waiting for application to be ready..."
          MAX_ATTEMPTS=60
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            # Check if container is still running
            if ! docker ps | grep -q test-app; then
              echo "❌ Container stopped unexpectedly"
              docker logs test-app
              exit 1
            fi

            # Try to connect to health endpoint
            if curl -f -s -o /dev/null -w "%{http_code}" http://localhost:3000/health 2>/dev/null | grep -q "200"; then
              echo "✅ Application is responding"
              echo "status=ready" >> $GITHUB_OUTPUT
              break
            fi

            if [ $ATTEMPT -eq $(($MAX_ATTEMPTS - 1)) ]; then
              echo "❌ Application failed to become ready after $MAX_ATTEMPTS attempts"
              echo "Container logs:"
              docker logs test-app
              exit 1
            fi

            ATTEMPT=$((ATTEMPT + 1))
            echo "Waiting for application... ($ATTEMPT/$MAX_ATTEMPTS)"
            sleep 2
          done

      - name: Test health endpoint
        if: steps.wait.outputs.status == 'ready'
        id: health
        run: |
          echo "Testing /health endpoint..."

          RESPONSE=$(curl -s -w "\n%{http_code}" http://localhost:3000/health)
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "HTTP Status: $HTTP_CODE"
          echo "Response Body: $BODY"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "response<<EOF" >> $GITHUB_OUTPUT
            echo "$BODY" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "✅ Health check passed"
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "❌ Health check failed with status $HTTP_CODE"
            exit 1
          fi

      - name: Test root endpoint
        if: steps.health.outputs.status == 'success'
        id: root
        run: |
          echo "Testing root endpoint..."

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/)
          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
            echo "✅ Root endpoint check passed"
          else
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "❌ Root endpoint check failed with status $HTTP_CODE"
            exit 1
          fi

      - name: Show application logs
        if: always() && steps.start.outputs.status == 'started'
        run: |
          echo "=== Application Logs ==="
          docker logs test-app || true

      - name: Cleanup containers
        if: always()
        run: |
          echo "Cleaning up containers..."
          docker stop test-app test-db || true
          docker rm test-app test-db || true

      - name: Post PR comment on success
        if: github.event_name == 'pull_request' && steps.root.outputs.status == 'success'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: production-image-verification
          message: |
            ## ✅ Production Image Verification Passed

            The production Docker image was built and verified successfully:

            - ✅ Image builds without errors
            - ✅ Container starts successfully
            - ✅ Health endpoint returns 200 OK
            - ✅ Root endpoint returns 200 OK

            **Health Response:**
            ```json
            ${{ steps.health.outputs.response }}
            ```

      - name: Post PR comment on failure
        if: always() && github.event_name == 'pull_request' && (steps.build.outputs.status == 'failure' || steps.health.outputs.status == 'failure' || steps.root.outputs.status == 'failure')
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: production-image-verification
          message: |
            ## ❌ Production Image Verification Failed

            The production Docker image verification failed:

            - ${{ steps.build.outputs.status == 'success' && '✅' || '❌' }} Image build
            - ${{ steps.start.outputs.status == 'started' && '✅' || '❌' }} Container start
            - ${{ steps.wait.outputs.status == 'ready' && '✅' || '❌' }} Application readiness
            - ${{ steps.health.outputs.status == 'success' && '✅' || '❌' }} Health endpoint
            - ${{ steps.root.outputs.status == 'success' && '✅' || '❌' }} Root endpoint

            Please check the workflow logs for details.

      - name: Fail build if verification failed
        if: steps.build.outputs.status == 'failure' || steps.health.outputs.status == 'failure' || steps.root.outputs.status == 'failure'
        run: |
          echo "❌ Production image verification failed"
          exit 1
