# Production Docker Compose for Portainer Deployment
# This file combines docker-compose.yml and docker-compose.prod.yml
# for easy deployment in Portainer's Web editor
#
# IMPORTANT: Set environment variables in Portainer's Environment Variables section
# Do NOT use an .env file - Portainer will inject the variables you configure in the UI

services:
  players:
    image: ghcr.io/jamiepinkham/players:main
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - web
    # Environment variables are set in Portainer UI
    # No volumes needed - image contains all application code

  assets:
    image: ghcr.io/jamiepinkham/players:main
    restart: unless-stopped
    environment:
      WATCH: "0"
    # Environment variables inherited from stack environment

  db:
    image: postgres:16
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DATABASE_USER} -d $${DATABASE_NAME}"]
      interval: 2s
      timeout: 2s
      start_period: 30s
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    # Optional: Mount restore directory if you need to restore from backup
    # Uncomment the line below and create the directory on your host
    # volumes:
    #   - pgdata:/var/lib/postgresql/data
    #   - ./db-restore:/db-restore:ro

volumes:
  pgdata:

networks:
  web:
    external: true
