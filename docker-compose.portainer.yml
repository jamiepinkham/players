# Production Docker Compose for Portainer Deployment
# This file combines docker-compose.yml and docker-compose.prod.yml
# for easy deployment in Portainer's Web editor
#
# IMPORTANT: Set environment variables in Portainer's Environment Variables section
# Do NOT use an .env file - Portainer will inject the variables you configure in the UI

services:
  players:
    image: ghcr.io/jamiepinkham/players:main
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - web
    ports:
      - "3000:3000"
    environment:
      # Database Configuration
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_HOST: ${DATABASE_HOST}
      # Rails Configuration
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      RAILS_ENV: ${RAILS_ENV}
      # Mailgun Configuration
      MAILGUN_SMTP_ADDRESS: ${MAILGUN_SMTP_ADDRESS}
      MAILGUN_SMTP_PORT: ${MAILGUN_SMTP_PORT}
      MAILGUN_SMTP_DOMAIN: ${MAILGUN_SMTP_DOMAIN}
      MAILGUN_SMTP_USERNAME: ${MAILGUN_SMTP_USERNAME}
      MAILGUN_SMTP_PASSWORD: ${MAILGUN_SMTP_PASSWORD}
      MAILGUN_SMTP_AUTHENTICATION: ${MAILGUN_SMTP_AUTHENTICATION:-plain}
      MAILER_FROM: ${MAILER_FROM}
      # Proxy Configuration
      DISABLE_FORCE_SSL: ${DISABLE_FORCE_SSL:-true}
      RAILS_LOG_TO_STDOUT: ${RAILS_LOG_TO_STDOUT:-true}
      RAILS_SERVE_STATIC_FILES: ${RAILS_SERVE_STATIC_FILES:-true}
      DISABLE_HOST_CHECK: ${DISABLE_HOST_CHECK:-true}
      # Optional
      APP_HOST: ${APP_HOST:-}
      ASSET_HOST: ${ASSET_HOST:-}

  scheduler:
    image: ghcr.io/jamiepinkham/players:main
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
    command: ["supercronic", "/app/config/crontab"]
    environment:
      # Database Configuration
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_HOST: ${DATABASE_HOST}
      # Rails Configuration
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      RAILS_ENV: ${RAILS_ENV}
      # Logging
      RAILS_LOG_TO_STDOUT: ${RAILS_LOG_TO_STDOUT:-true}

  db:
    image: postgres:16
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 2s
      start_period: 30s
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}

volumes:
  pgdata:

networks:
  web:
    external: true
